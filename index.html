<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auremetra</title>
<style>
:root{--bg:#fbfaf7;--text:#22201c;--muted:#6b665d;--accent:#8a6a1f;--rule:#e4dfd4}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--text:#ece8e0;--muted:#a59f94;--accent:#d8b45c;--rule:#34312c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:32px 16px 56px}
main{max-width:680px;margin:0 auto}
nav{font-size:15px;margin-bottom:24px}
a{color:var(--accent)}
h1{font-size:28px;line-height:1.25;margin:0 0 8px}
h2{font-size:20px;margin:32px 0 8px;padding-top:16px;border-top:1px solid var(--rule)}
p,ul{margin:0 0 14px}
ul{padding-left:22px}
li{margin-bottom:6px}
.date{color:var(--muted);margin-bottom:24px}
</style>
</head>
<body>
<main>
<h1>Auremetra</h1>
<p>Calculator and workshop notebook for jewelers.</p>
<p><a href="/privacy/">Privacy Policy</a></p>
<p>Contact: <a href="mailto:auremetra@gmail.com">auremetra@gmail.com</a></p>
</main>
</body>
</html>
